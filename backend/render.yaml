# ============================================================
# BIRTHDAY QUEST - RENDER DEPLOYMENT
# ============================================================

services:
  - type: web
    name: birthday-quest-backend
    runtime: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
    startCommand: |
      gunicorn wsgi:app \
        --bind 0.0.0.0:$PORT \
        --workers 2 \
        --threads 4 \
        --timeout 120 \
        --chdir backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_NAME
        value: Birthday Quest
      - key: LOG_LEVEL
        value: INFO

      # ------------------------------------------------------
      # SECRETS — set these in Render Dashboard, NOT here
      # ------------------------------------------------------
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRUSTED_HOSTS
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: ADMIN_UIDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
